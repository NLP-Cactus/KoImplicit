[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "koimplicit"
version = "0.1.0"
description = "Korean dialogue null-subject resolution research workspace"
requires-python = ">=3.10"
dependencies = ["pydantic>=2"]
readme = "README.md"

[project.scripts]
koimplicit = "koimplicit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
